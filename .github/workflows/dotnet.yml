# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    - name: Upload cli artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Cli
        path: /home/runner/work/Parkeringsautomaten/Parkeringsautomaten/Parkeringsautomaten.Cli/bin/Release/net10.0/
    
    - name: Upload lib artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Lib
        path: /home/runner/work/Parkeringsautomaten/Parkeringsautomaten/Parkeringsautomaten.Lib/bin/Release/net10.0/
   
    - name: Upload gtk artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Gtk
        path: /home/runner/work/Parkeringsautomaten/Parkeringsautomaten/Parkeringsautomaten.Gtk/bin/Release/net10.0/        

